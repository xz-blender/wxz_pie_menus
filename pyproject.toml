[project]
name = "wxz-pie-menus"
version = "0.2.4"
description = "Development dependencies for WXZ Pie Menus; run the add-on inside Blender"
authors = [{ name = "wxz" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pillow==12.0.0", "numpy==2.3.4", "shapely==2.1.2", "requests==2.32.5"]

[dependency-groups]
dev = ["ruff==0.14.0", "pip==25.2"]

# VS Code Ruff 扩展使用的配置段
[tool.ruff]
# 目标 Python 版本
target-version = "py311"
# 最大行宽
line-length = 120
# 排除不需要分析的路径
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
]
# 允许 Ruff 自动修复可修复的问题
fix = false

# 与旧版保持一致的忽略规则
[tool.ruff.lint]
ignore = ["E722", "F401", "F403", "F405", "F811", "E741","RUF012","S110","S112","SIM118","BLE001"]
