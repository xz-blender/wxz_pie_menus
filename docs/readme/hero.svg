<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">WXZ Pie Menus</title>
  <desc id="desc">把常用操作，放到手边。Blender 饼菜单、建模工具与工作流预设。右侧为菜单入口示意。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2a"/><stop offset="1" stop-color="#17283b"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#ffcf8a"/><stop offset="1" stop-color="#f39547"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b5d8ff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)"/>
  <path d="M48 49H78" stroke="#ffb568" stroke-width="4"/>
  <text x="91" y="55" fill="#90a7c0" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">BLENDER WORKFLOW COLLECTION</text>
  <text x="48" y="138" fill="#f3f7fc" font-family="Arial,sans-serif" font-weight="700" font-size="64" letter-spacing="-2">WXZ Pie Menus</text>
  <text x="51" y="203" fill="#f4c593" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="34" font-weight="600">把常用操作，放到手边。</text>
  <text x="51" y="246" fill="#a4b7cd" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18">饼菜单 · 建模工具 · 工作流预设</text>
  <g font-family="Arial,sans-serif" font-size="13" letter-spacing="1">
    <rect x="51" y="294" width="139" height="35" rx="17.5" fill="#23364c"/><text x="71" y="317" fill="#cedcec">CONTEXT AWARE</text>
    <rect x="201" y="294" width="145" height="35" rx="17.5" fill="#23364c"/><text x="221" y="317" fill="#cedcec">MODULAR TOOLS</text>
    <rect x="357" y="294" width="140" height="35" rx="17.5" fill="#23364c"/><text x="379" y="317" fill="#cedcec">LOCAL ASSETS</text>
