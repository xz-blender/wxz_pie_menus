schema_version = "1.0.0"

id = "wxz_pie_menus"
version = "0.2.4"
name = "XZ-Blender作者预设"
tagline = "包含众多饼菜单和实用工具,启用预设前请备份好您的个人配置"
maintainer = "WXZ <wxz03111997@gmail.com>"
type = "add-on"
website = "https://github.com/xz-blender/wxz_pie_menus"
tags = ["3D View", "Modeling"]
blender_version_min = "4.2.0"
license = [
  "SPDX:GPL-2.0-or-later",
]
wheels = [
  "wheels/certifi-2026.7.22-py3-none-any.whl",
  "wheels/charset_normalizer-3.5.1-cp313-cp313-win_amd64.whl",
  "wheels/idna-3.19-py3-none-any.whl",
  "wheels/numpy-2.5.3-cp313-cp313-win_amd64.whl",
  "wheels/pillow-12.3.0-cp313-cp313-win_amd64.whl",
  "wheels/requests-2.34.2-py3-none-any.whl",
  "wheels/shapely-2.1.2-cp313-cp313-win_amd64.whl",
  "wheels/urllib3-2.8.0-py3-none-any.whl",
]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "/*.zip",
  "*.blend[1-9]",
  "/dist/",
  "/docs/",
  "/tests/",
  "/scripts/",
  "/pyproject.toml",
  "/uv.lock",
  "/CONTEXT.md",
]
